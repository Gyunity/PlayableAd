<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prison Life</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-canvas {
            aspect-ratio: 9 / 16;
            height: 100vh;
            height: 100dvh;
            max-width: 100vw;
            max-height: calc(100vw * 16 / 9);
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/PrisonLife.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/PrisonLife.data.unityweb",
        frameworkUrl: "Build/PrisonLife.framework.js.unityweb",
        codeUrl: "Build/PrisonLife.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Prison Life",
        productVersion: "0.1",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
</body>
</html>
